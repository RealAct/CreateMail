name: Build for macOS

# Produces CreateMail.app for Apple Silicon and Intel Macs as downloadable
# workflow artifacts. Run it from the Actions tab ("Run workflow"), or push a
# tag like v1.0.0 to also attach the zips to a GitHub release.
#
# Builds are ad-hoc signed. To sign and notarize with your own Apple
# Developer ID, add the APPLE_* secrets and set SIGN_BUILD=true below.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            arch: arm64
            label: AppleSilicon
          - os: macos-26-intel
            arch: x64
            label: Intel

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Build
        run: npm run build

      - name: Rename artifact
        run: mv app/dist/CreateMail.zip "app/dist/CreateMail-${{ matrix.label }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: CreateMail-${{ matrix.label }}
          path: app/dist/CreateMail-${{ matrix.label }}.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: app/dist/CreateMail-${{ matrix.label }}.zip
